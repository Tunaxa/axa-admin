name: CI

on:
  # No branch filter: tasks are delivered as stacked pull requests whose base is
  # often another task branch rather than `dev`, and those need checking too.
  pull_request:
  push:
    branches: [main, dev]
    
permissions:
  contents: read
  packages: read
  pull-requests: read
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # The frontend and backend are scaffolded by separate tasks and are not both
  # present on every branch. This job reports which exist so the checks below
  # skip cleanly instead of failing on a directory that has no package.json.
  #
  # It has to run after a checkout, which is why it is a job rather than a
  # `hashFiles` guard: job-level `if` expressions are evaluated before the
  # workspace is populated, so such a guard would always be false.
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for scaffolded projects
        id: check
        run: |
          for project in frontend backend; do
            if [ -f "$project/package.json" ]; then
              echo "$project=true" >> "$GITHUB_OUTPUT"
            else
              echo "$project=false" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Skips silently until the frontend has a test script.
      - name: Test
        run: npm run test --if-present

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    env:
      # `prisma generate` reads the datasource URL through `prisma.config.ts`
      # and fails if it is missing. Generation does not open a connection, so a
      # syntactically valid placeholder is enough — no database is started.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The generated client carries the model types, so type-checking fails
      # without this step.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  # Builds both container images on every pull request, because a Dockerfile
  # that is never built is a Dockerfile that does not work. It also prints the
  # sizes, so a change that quietly doubles an image is visible in the log
  # rather than at deploy time.
  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        if: needs.detect.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: axa-admin-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        if: needs.detect.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: axa-admin-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The backend image strips Prisma's build-time peer dependencies, which
      # is worth a lot of megabytes and would break the container if anything
      # ever needed one at run time. Starting it is how that gets caught.
      - name: Smoke-test the backend image
        if: needs.detect.outputs.backend == 'true'
        run: |
          docker run -d --name smoke -p 4000:4000             -e DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/ci?schema=public'             -e MONGODB_URL='mongodb://127.0.0.1:27017/ci'             -e JWT_SECRET=ci             axa-admin-backend:ci
          # It cannot reach a database, so it is expected to fail on connect —
          # what is being checked is that Node resolves every module and gets
          # as far as bootstrapping Nest.
          sleep 10
          docker logs smoke
          docker logs smoke 2>&1 | grep -q 'Cannot find module' && {
            echo '::error::the runtime image is missing a module it needs'
            exit 1
          }
          echo 'No missing modules.'

      - name: Report image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep axa-admin || true
