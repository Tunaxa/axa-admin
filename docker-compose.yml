# Local databases for AXA Admin development: PostgreSQL for everything the
# application records, MongoDB for the docs module's pages.
services:
  postgres:
    image: postgres:16-alpine
    container_name: axa-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axa}
      POSTGRES_DB: ${POSTGRES_DB:-axa_admin}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-axa} -d ${POSTGRES_DB:-axa_admin}']
      interval: 10s
      timeout: 5s
      retries: 5

  # The docs module stores its page tree and content blocks here. Document
  # shapes vary per block type and a page is read and written whole, which is
  # what a document store is for; the relational data stays in PostgreSQL.
  mongo:
    image: mongo:8
    container_name: axa-admin-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-axa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-axa}
    ports:
      - '${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mongo-data:
