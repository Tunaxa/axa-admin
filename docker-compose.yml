# Local PostgreSQL instance for AXA Admin development.
services:
  postgres:
    image: postgres:16-alpine
    container_name: axa-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axa}
      POSTGRES_DB: ${POSTGRES_DB:-axa_admin}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-axa} -d ${POSTGRES_DB:-axa_admin}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
